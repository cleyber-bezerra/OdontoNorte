<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OdontoNorte</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background: #f4f8fb;
    }

    .hero {
      background: linear-gradient(120deg, #075985, #0891b2);
      color: white;
    }

    .card {
      border: 0;
      box-shadow: 0 4px 18px #00000012;
    }

    .status {
      font-size: 0.8rem;
    }
  </style>
</head>

<body>
  <header class="hero py-4">
    <div class="container">
      <h1>OdontoNorte</h1>
      <p class="mb-0">Gestão simples de pacientes e consultas odontológicas</p>
    </div>
  </header>

  <main class="container py-4">
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card p-3">
          <small>Pacientes</small>
          <h2 id="qtdPacientes">0</h2>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card p-3">
          <small>Dentistas</small>
          <h2 id="qtdDentistas">0</h2>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card p-3">
          <small>Consultas</small>
          <h2 id="qtdConsultas">0</h2>
        </div>
      </div>
    </div>

    <div class="row g-4 mb-4">
      <section class="col-lg-5">
        <div class="card p-4">
          <h3 class="h5">Novo paciente</h3>

          <form id="formPaciente">
            <input
              id="nome"
              class="form-control mb-2"
              placeholder="Nome completo"
              required
            >

            <input
              id="telefone"
              class="form-control mb-2"
              placeholder="Telefone"
              required
            >

            <input
              id="email"
              type="email"
              class="form-control mb-3"
              placeholder="E-mail"
              required
            >

            <button class="btn btn-info w-100">
              Cadastrar
            </button>
          </form>

          <div id="mensagem" class="mt-2"></div>
        </div>
      </section>

      <section class="col-lg-7">
        <div class="card p-4">
          <h3 class="h5">Pacientes cadastrados</h3>

          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nome</th>
                  <th>Telefone</th>
                  <th>E-mail</th>
                </tr>
              </thead>

              <tbody id="pacientes"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

    <div class="row g-4">
      <section class="col-12">
        <div class="card p-4">
          <h3 class="h5">Próximas consultas</h3>

          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Paciente</th>
                  <th>Dentista</th>
                  <th>Procedimento</th>
                  <th>Valor</th>
                  <th>Status</th>
                </tr>
              </thead>

              <tbody id="consultas"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const api = '/api';

    const moeda = valor =>
      Number(valor).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });

    const dataBR = valor =>
      new Date(valor + 'T00:00:00').toLocaleDateString('pt-BR');

    async function carregar() {
      try {
        const [resPacientes, resDentistas, resConsultas] = await Promise.all([
          fetch(api + '/pacientes'),
          fetch(api + '/dentistas'),
          fetch(api + '/consultas')
        ]);

        if (!resPacientes.ok || !resDentistas.ok || !resConsultas.ok) {
          throw new Error('Não foi possível carregar os dados.');
        }

        const [pacientesDados, dentistasDados, consultasDados] =
          await Promise.all([
            resPacientes.json(),
            resDentistas.json(),
            resConsultas.json()
          ]);

        qtdPacientes.textContent = pacientesDados.length;
        qtdDentistas.textContent = dentistasDados.length;
        qtdConsultas.textContent = consultasDados.length;

        pacientes.innerHTML = pacientesDados.length
          ? pacientesDados.map(paciente => `
              <tr>
                <td>${paciente.id}</td>
                <td>${paciente.nome}</td>
                <td>${paciente.telefone}</td>
                <td>${paciente.email}</td>
              </tr>
            `).join('')
          : `
              <tr>
                <td colspan="4" class="text-center text-muted">
                  Nenhum paciente cadastrado.
                </td>
              </tr>
            `;

        consultas.innerHTML = consultasDados.length
          ? consultasDados.map(consulta => `
              <tr>
                <td>${consulta.paciente}</td>
                <td>${consulta.dentista}</td>
                <td>${consulta.procedimento}</td>
                <td>${moeda(consulta.valor)}</td>
                <td>
                  <span class="badge text-bg-primary status">
                    ${consulta.status}
                  </span>
                </td>
              </tr>
            `).join('')
          : `
              <tr>
                <td colspan="5" class="text-center text-muted">
                  Nenhuma consulta cadastrada.
                </td>
              </tr>
            `;
      } catch (erro) {
        console.error(erro);

        mensagem.innerHTML = `
          <span class="text-danger">
            Não foi possível atualizar os dados da página.
          </span>
        `;
      }
    }

    formPaciente.addEventListener('submit', async evento => {
      evento.preventDefault();

      try {
        const resposta = await fetch(api + '/pacientes', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            nome: nome.value,
            telefone: telefone.value,
            email: email.value
          })
        });

        const resultado = await resposta.json();

        if (!resposta.ok) {
          mensagem.innerHTML = `
            <span class="text-danger">
              ${resultado.erro || 'Não foi possível cadastrar o paciente.'}
            </span>
          `;
          return;
        }

        mensagem.innerHTML = `
          <span class="text-success">
            Paciente cadastrado com sucesso.
          </span>
        `;

        formPaciente.reset();

        await carregar();
      } catch (erro) {
        console.error(erro);

        mensagem.innerHTML = `
          <span class="text-danger">
            Erro de comunicação com o servidor.
          </span>
        `;
      }
    });

    carregar();
  </script>
</body>
</html>
