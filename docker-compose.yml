services:
  postgres:
    image: postgres:16
    container_name: odontonorte_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - odonto_dados:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: odontonorte_backend
    restart: unless-stopped

    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${BACKEND_PORT}:3000"

    depends_on:
      postgres:
        condition: service_healthy


  adminer:
    image: adminer:4
    container_name: odontonorte_adminer
    restart: unless-stopped

    environment:
      ADMINER_DEFAULT_SERVER: postgres

    ports:
      - "${ADMINER_PORT}:8080"

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  odonto_dados: